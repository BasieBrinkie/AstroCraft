# Configuration file

ai {
    # Horizontal distance (blocks) within which the return-to-start teleport is suppressed [range: 0.5 ~ 32.0, default: 3.0]
    S:returnHomeArrivalTolerance=3.0

    # Walk the last steps back to the start point instead of pausing and teleporting when almost there [default: true]
    B:returnHomeSmoothArrival=true

    # Seconds before an npc that cannot reach its start point is teleported there (vanilla: 30) [range: 1 ~ 3600, default: 30]
    I:returnHomeTimeoutSeconds=30
}


bard {
    # Bard music volume multiplier (0.0-1.0) [range: 0.0 ~ 1.0, default: 1.0]
    S:BardVolume=1.0

    # Watchdog seconds: force-switch a bard song that plays longer than this [range: 1 ~ 3600, default: 300]
    I:BardWatchdogSeconds=300
}


craftingview {
    # Show the crafting recipe sidebar on carpentry bench / workbench [default: true]
    B:craftingViewEnabled=true
}


interact {
    # Let held items (bow, food, potion) still work when the crosshair is on an NPC that has nothing to interact with [default: true]
    B:interactPassthrough=true
}


recipe {
    # Format: itemId|field1,field2;itemId2|fieldA  (ignoreDamage=config fuzzy) [default: tacz:modern_kinetic_gun|GunId;slashblade:slashblade|]
    S:recipeFuzzyMatchRules=tacz:modern_kinetic_gun|GunId;slashblade:slashblade|
}


