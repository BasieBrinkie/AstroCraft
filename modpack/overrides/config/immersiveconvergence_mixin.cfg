# Configuration file

general {

    mixinsettings {
        # Log every tile entity addition the World mixin sees. Needs enableWorldMixin [Default=false]
        B:enableAdditionsLogging=false

        # Enable the MinecraftServer mixin that redirects error logging, for crash debugging [Default=true]
        B:enableErrorLoggingRedirect=true

        # Log the tile entity additions the World mixin judges risky. Needs enableWorldMixin [Default=true]
        B:enablePotentialsLogging=true

        # Enable the World mixin that fixes the concurrent modification crash when tile entities are added while the world is ticking [Default=true]
        B:enableWorldMixin=true

        # Replace Immersive Engineering's conveyors with Immersive Convergence's own implementations. Has no effect without Immersive Engineering [Default=true]
        B:replaceIEConveyors=true

        # Replace Immersive Engineering's fluid pipes and fluid pump with Immersive Convergence's own implementations. Turning this off also means Immersive Engineering's own pipes no longer recognise Immersive Technology's fluid valve as a pipe, so pressurized flow stops at the valve. Has no effect without Immersive Engineering [Default=true]
        B:replaceIEPipes=true
    }

}


