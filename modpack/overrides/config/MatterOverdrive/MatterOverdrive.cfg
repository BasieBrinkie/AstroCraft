##########################################################################################################
# server
#--------------------------------------------------------------------------------------------------------#
# Options for the Matter Overdrive server
##########################################################################################################

server {

    gravitational_anomaly {
        # How often (in ticks) the anomaly runs a break batch.
        I:"batch tick rate"=4

        # Should the gravitational anomaly destroy blocks [default: true]
        B:"block destruction"=true

        # How many blocks the anomaly breaks each time the break batch runs.
        I:"blocks per batch"=1

        # How often (in ticks) the anomaly rescans for nearby entities. Force is still applied every tick. Higher values reduce CPU cost at the expense of slightly delayed pickup of newly entered entities.
        I:"entity scan rate"=10

        # How often (in ticks) an equipped Space-Time Equalizer loses 1 durability while resisting an anomaly. Set to 0 to disable durability drain.
        I:"equalizer damage rate"=200

        # Should the blocks drop entities or be directly consumed when destroyed by the gravitational anomaly [default: true]
        B:"gravitational anomaly block entities"=true

        # Should blocks be turned into falling blocks when broken [default: true]
        B:"gravitational anomaly falling blocks"=true

        # Should other mod fluid blocks be consumed by the anomaly [default: true]
        B:"gravitational anomaly forge fluids"=true

        # Should vanilla fluid block such as water and lava be consumed by the anomaly [default: true]
        B:"gravitational anomaly vanilla fluids"=true

        # Should the gravitational entity pull entities towards it [default: true]
        B:"gravitational pull"=true

        # How many ticks the anomaly waits before re-scanning after a full sweep found nothing to break. Default 60 (~3 seconds). Reduces CPU when the anomaly has consumed all nearby blocks.
        I:"idle scan ticks"=60

        # How many blocks the anomaly checks per tick while sweeping its array. 
        # The anomaly divides its full sphere into distance sorted array 
        # For example, a sphere of radius 12 contains ~7200 positions; 
        # at 128 checks/tick that is ~56 ticks (~2.8s) per full sweep. 
        # Higher = faster sweeps but more block lookups aka more CPU usage.
        I:"scan batch size"=128
    }

}


