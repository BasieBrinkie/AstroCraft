# Configuration file

general {

    multiblocks {
        # How a machine comes apart. PROCESS_QUEUE breaks it down block by block over a few ticks and drops all its materials at the broken block; TEMPLATE_BLOCKS instantly reverts it to the blocks it was built from. Sneak-breaking always uses TEMPLATE_BLOCKS. Applies to Immersive Engineering, Immersive Petroleum and Immersive Technology multiblocks alike [Default=PROCESS_QUEUE]
        # Valid values:
        # PROCESS_QUEUE
        # TEMPLATE_BLOCKS
        S:disassemblyMode=PROCESS_QUEUE
    }

    mechanical {
        # The maximum rotational speed any mechanical device can reach, in RPM [Default=7200]
        I:maxRpm=7200
    }

    heat {
        # The maximum heat level any heat device can provide or require [Default=2000.0]
        D:maxHeat=2000.0
    }

    pipes {
        # Pipes remember the last path they served (cheaper) instead of round-robining every destination [Default=false]
        B:lastServed=false

        # How much a fluid pipe can move per operation while pressurized, in mB [Default=2500]
        # Min: 1
        # Max: 2147483647
        I:pressurizedTransferRate=2500

        # How much a fluid pipe can move per operation, in mB [Default=100]
        # Min: 1
        # Max: 2147483647
        I:transferRate=100
    }

    petroleum {
        # Energy buffer of a pumpjack whose reservoir declares no power tier, in IF [Default=16000]
        # Min: 1
        # Max: 2147483647
        I:defaultCapacity=16000

        # How fast a reservoir that declares no pump speed is pumped, in mB/tick [Default=25]
        # Min: 1
        # Max: 2147483647
        I:defaultPumpSpeed=25

        # Energy a pumpjack whose reservoir declares no power tier consumes per tick, in IF [Default=1024]
        # Min: 1
        # Max: 2147483647
        I:defaultUsage=1024

        # Draw the reservoir's power tier in the pumpjack JEI page [Default=true]
        B:jeiDrawPowerTier=true

        # Draw the reservoir's spawn weight in the pumpjack JEI page [Default=true]
        B:jeiDrawSpawnWeight=true
    }

    experimental {
        # EXPERIMENTAL. Run as though Immersive Engineering were not installed, even when it is.
        # Every Immersive Engineering path in Immersive Convergence and Immersive Technology gates off: no wires, no conveyors, no connectors, no IE multiblock templates, and none of the content built out of IE blocks or items. Immersive Petroleum gates off with it, because it cannot work without Immersive Engineering.
        # Recipes that name IE items will have no valid ingredients, multiblocks whose templates are built from IE blocks cannot be assembled, and anything already placed from them will not come back.
        # Turning this on means: I know what I am doing, and I can replace the needed recipes, and NBT data myself.
        # [Default=false]
        B:disableImmersiveEngineering=false
    }

}


