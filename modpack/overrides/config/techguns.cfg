        B:dimensionAutoadd=false

        # Dimensions (e.g: 12, 13, 14 etc.) that are included in Techguns monster spawning in the End spawnlist. NOTE: ONLY WORKS IF DimensionsAutoAdd TURNED OFF!
        S:dimensionWhitelistEnd <
            
         >

        # Dimensions (e.g: 12, 13, 14 etc.) that are included in Techguns monster spawning in the Nether spawnlist. NOTE: ONLY WORKS IF DimensionsAutoAdd TURNED OFF!
        S:dimensionWhitelistNether <
            
         >

        # Dimensions (e.g: 12, 13, 14 etc.) that are included in Techguns monster spawning to use Overworld spawnlist. NOTE: ONLY WORKS IF DimensionsAutoAdd TURNED OFF!
        S:dimensionWhitelistOverworld <
            
         >

