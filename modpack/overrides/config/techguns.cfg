general {
    S:ExplosiveChargeAdvancedMaxHardness=1000.0
    S:ExplosiveChargeMaxHardness=49
    B:RestrictUnsafeModeToOP=false
    I:UpgradeXPCost=20
    B:WIP_disableRadiationSystem=true
    B:debug=false
    B:disableAutofeeder=true
    B:keepLavaRecipesWhenFuelIsPresent=false
    B:machinesNeedNoPower=false

    general {
        # Disable Radiation for players. (Radiation system is still WIP)
        B:WIP_disableRadiationSystem=false

        # Disable automatic feeding of Food in the Techguns inventory tab.
        B:disableAutofeeder=false

        # Keep recipes with lava instead of fuel even when fuel from any other mods is present.
        B:keepLavaRecipesWhenFuelIsPresent=false

        # Limits using unsafe guns mode to opped players; the config option OVERRIDES the permission setting 'techguns.allowunsafemode'
        B:limitUnsafeModeToOP=false

        # Disables power usage for all machines; activate this if you don't want to install additional tech mods.
        B:machinesNeedNoPower=false
    }

    misc {
        # Registers oreDicts entries for carbon, titanium, circuits and other items that might be used from other mods.
        B:addOreDicts=true

        # Enables steel recipe in a TG blast furnace.
        B:addSteelRecipe=true

        # Enable debug items and unfinished stuff; disable this for regular survival.
        B:debug=false

        # Disable armor drops from mobs / NPCs
        B:disableArmorDrops=false

        # Disable gun drops from mobs / NPCs
        B:disableGunDrops=false

        # Highest blockHardness advanced explosive charges can break; obsidian is 50.0
        D:explosiveChargeAdvancedMaxBlockHardness=100.0

        # Highest blockHardness normal explosive charges can break; obsidian is 50.0
        D:explosiveChargeMaxBlockHardness=30.0

        # false = default TG mode (spawns only ITGSpawnerNPC mobs from presets). true = custom mode (spawns any EntityLiving from this spawner's mobtypes NBT id; use this when editing spawner NBT to point at entities from other mods).
        B:spawnerBlockUseCustomEntitySpawn=false

        # Base XP value for Upgrade Bench recipes (enchants)
        # Min: 0
        # Max: 10000
        I:upgrade_xp_cost=20
    }

    ##########################################################################################################
    # srparasites integration
    #--------------------------------------------------------------------------------------------------------#
    # Options for those using Techguns with the Scape & Run: Parasites mod (or other mods with hard monsters)
    ##########################################################################################################

    "srparasites integration" {
        # Increase the Nuclear Death Ray's damage to make it the only weapon against the parasites. false = default NDR damage
        B:rebalance_nucleardeathray=false

        # Increase the BFG-10K's damage to make it more deadly for parasites. false = default BFG damage
        B:rebalance_tfg=false
    }

    "disable items" {
        # Add bronze ingots.
        B:addBronzeIngots=true

        # Add copper ingots.
        B:addCopperIngots=true

        # Add copper nuggets.
        B:addCopperNuggets=true

        # Add lead ingots.
        B:addLeadIngots=true

        # Add Lead nuggets.
        B:addLeadNuggets=true

        # Add steel ingots.
        B:addSteelIngots=true

        # Add steel nuggets.
        B:addSteelNuggets=true

        # Add tin ingots.
        B:addTinIngots=true
    }

    "npc spawn" {
        # Biome Registry names (e.g: minecraft:mushroom_island) that are excluded from Techguns monster spawning
        S:biomeBlacklist <
            
         >

