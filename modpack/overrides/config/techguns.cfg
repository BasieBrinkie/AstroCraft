    "damage factors" {
        # Damage factor for all NPCs other than turrets, multiplied by default difficulty penalty (easy - 0.6, normal - 0.8, hard - 1.0)
        # Min: 0.0
        # Max: 100.0
        D:damageFactorNPC=1.0

        # Damage factor Techguns weapons deal when fired from players against other players; it automatically sets to zero when PvP is disabled
        # Min: 0.0
        # Max: 100.0
        D:damagePvP=0.5

