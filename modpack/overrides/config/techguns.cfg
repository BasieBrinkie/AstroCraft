        # Min: 0.0
        # Max: 100.0
        D:damageTurretToPlayer=0.5
    }

    "world generation" {
        # Generate Copper Ore (advised to disable if other mod does)
        B:doOreGenCopper=true

        # Generate Lead Ore (advised to disable if other mod does)
        B:doOreGenLead=true

        # Generate Tin Ore (advised to disable if other mod does)
        B:doOreGenTin=true

        # Generate Titanium (advised to disable if other mod does)
        B:doOreGenTitanium=true

        # Generate Uranium (advised to disable if other mod does)
        B:doOreGenUranium=true

        # Should any Techguns structures spawn in the world?
        B:doWorldspawn=true

        # When worldgen is enabled, include structure spawns that contain ore clusters.
        B:spawnOreClusterStructures=true

        # Every X chunks Techguns tries to spawn a Big building. This is only in the End; ChunkX, and ChunkY modulo <this Value> must be 0
        # Min: 8
        # Max: 100000
        I:spawnWeightTGStructureBigEnd=64

        # Every X chunks Techguns tries to spawn a Big building. This is only in the Nether; ChunkX, and ChunkY modulo <this Value> must be 0
        # Min: 16
        # Max: 100000
        I:spawnWeightTGStructureBigNether=24

        # Every X chunks Techguns tries to spawn a Big building. This is only in overworld; ChunkX, and ChunkY modulo <this Value> must be 0
        # Min: 16
        # Max: 100000
        I:spawnWeightTGStructureBigOverworld=64

        # Every X chunks Techguns tries to spawn a Medium building. This is only in the End; ChunkX, and ChunkY modulo <this Value> must be 0
        # Min: 8
        # Max: 100000
        I:spawnWeightTGStructureMediumEnd=42

        # Every X chunks Techguns tries to spawn a Medium building. This is only in the Nether; ChunkX, and ChunkY modulo <this Value> must be 0
        # Min: 8
        # Max: 100000
        I:spawnWeightTGStructureMediumNether=10

        # Every X chunks Techguns tries to spawn a Medium building. This is only in overworld; ChunkX, and ChunkY modulo <this Value> must be 0
        # Min: 8
        # Max: 100000
        I:spawnWeightTGStructureMediumOverworld=32

        # Every X chunks Techguns tries to spawn a Small building. This is only in the End; ChunkX, and ChunkY modulo <this Value> must be 0
        # Min: 8
        # Max: 100000
        I:spawnWeightTGStructureSmallEnd=16

        # Every X chunks Techguns tries to spawn a Small building. This is only in the Nether; ChunkX, and ChunkY modulo <this Value> must be 0
        # Min: 4
        # Max: 100000
