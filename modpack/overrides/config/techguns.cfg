        # Every X chunks Techguns tries to spawn a Small building. This is only in overworld; ChunkX, and ChunkY modulo <this Value> must be 0
        # Min: 4
        # Max: 100000
        I:spawnWeightTGStructureSmallOverworld=16
    }

    ##########################################################################################################
    # clientside
    #--------------------------------------------------------------------------------------------------------#
    # Clientside options, can be changed when playing on a server
    ##########################################################################################################

    clientside {
        # Enables Techguns death effects in general (biogun, lasergun and, if enabled, gore).
        B:cl_enableDeathFX=true

        # Enable the gore Death Effect; requires 'Enable Death Effects' to be enabled.
        B:cl_enableDeathFX_Gore=true

        # Multiply the FOV while sprinting by this value independent from the actual speed, has no effect when LockSpeedDependantFov is false.
        # Min: 1.0
        # Max: 10.0
        D:cl_fixedSprintFov=1.149999976158142

        # Counters the speed dependant FOV change. This also stops FOV changes while sprinting. Don't activate if another mod does this too.
        B:cl_lockSpeedFov=true

        # Each tick, Techguns particles are sorted via bubble sorting to determine in which order they should render. This parameter defines how many sort passes should be done in a single tick. 0 disables sorting entirely.
        # Min: 0
        # Max: 20
        I:cl_sortPassesPerTick=10

        "ammo hud" {
            # Changes the scale of the ammo icon (e.g. rifle ammo on AKM)
            # Min: 0.01
            # Max: 10.0
            D:cl_ammoIconScale=1.0

            # Changes the scale of the magazine count text (e.g. x19)
            # Min: 0.01
            # Max: 10.0
            D:cl_ammoMagTextScale=0.6499999761581421

            # Changes the scale of the ammo text (e.g. 30/30 on AKM)
            # Min: 0.01
            # Max: 10.0
            D:cl_ammoTextScale=1.0

            # Enables legacy ammo HUD while holding a gun (legacy means before 2.1 version)
            B:cl_enableLegacyHud=false

            # How many pixels should the ammo counter be away from the bottom side of the screen?
            # Min: 0
            # Max: 9999
            I:cl_hudMarginBottom=40

            # How many pixels should the ammo counter be away from the right side of the screen?
            # Min: 0
            # Max: 9999
            I:cl_hudMarginRight=40

            # How many pixels should the ammo icon be away from the ammo count text? (note: it's always moved LEFT from the text)
            # Min: 0
            # Max: 999
            I:cl_iconTextGap=6

            # How many pixels should the mag count text be away from the ammo count text? (note: it's always moved LOWER from the a.c. text)
            # Min: 0
            # Max: 999
            I:cl_textMagGap=3
        }

    }

